
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghost
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: ghost
    targetRevision: "19.0.0"
    helm:
      releaseName: ghost
      values: |
        ghostBlogTitle: My Ghost Blog
        service:
          type: ClusterIP
        persistence:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ghost
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

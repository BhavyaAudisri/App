
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ghost
  namespace: argocd
spec:
  project: deploy

  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: ghost
      targetRevision: 25.0.4
      helm:
        releaseName: ghost
        valueFiles:
          - $values/ghost/values.yaml

    - repoURL: https://github.com/BhavyaAudisri/App.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
